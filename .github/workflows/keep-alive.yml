name: Keep Render backend warm

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (Render sleeps after 15 min idle)
  workflow_dispatch:          # manual trigger button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          HTTP=$(curl -s -o /tmp/health.json -w "%{http_code}" -m 90 \
            https://igot-karmayogi-zs8h.onrender.com/api/health)
          echo "HTTP $HTTP — $(cat /tmp/health.json)"
          test "$HTTP" = "200"
