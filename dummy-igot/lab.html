<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<title>Hands-On Lab — iGOT Karmayogi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="common.js"></script>
<link rel="stylesheet" data-name="vs/editor/editor.main"
      href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css" />
<script src="i18n.js"></script>
<style>
  body { font-family: 'Poppins', sans-serif; }
  #editor-container { height: 400px; border: 1px solid #e2e8f0; border-radius: 0 0 12px 12px; overflow: hidden; }
  .problem-tab.active { background: #1d4ed8; color: white; border-color: #1d4ed8; }
  .problem-tab { transition: all 0.15s; }
  .tc-row.pass { border-color: #10b981; background: #f0fdf4; }
  .tc-row.fail { border-color: #ef4444; background: #fef2f2; }
  .tc-row.pending { border-color: #e2e8f0; background: #f8fafc; }
  #output-panel { font-family: 'Courier New', monospace; white-space: pre-wrap; }
  .diff-Easy   { background: #d1fae5; color: #065f46; }
  .diff-Medium { background: #fef3c7; color: #92400e; }
  .diff-Hard   { background: #fee2e2; color: #991b1b; }
  .diff-badge  { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
<div id="header"></div>

<!-- Top bar -->
<div class="bg-white border-b border-slate-100 px-6 py-3 flex items-center gap-4">
  <a id="backBtn" href="course_player.html" class="text-sm text-slate-500 hover:text-blue-700">← Back to course</a>
  <div class="flex-1 min-w-0">
    <h1 id="labTitle" class="text-lg font-bold text-[#1a3a6b] truncate">Hands-On Lab</h1>
    <p id="labSubtitle" class="text-xs text-slate-400 truncate"></p>
  </div>
  <script>document.write(renderLanguageDropdown());</script>
  <div id="pyodide-status" class="flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-full bg-amber-100 text-amber-700">
    <span class="inline-block animate-spin">⚙</span>&nbsp;Loading Python runtime…
  </div>
  <div id="scoreBadge" class="hidden text-sm font-bold px-4 py-1.5 rounded-full"></div>
</div>

<main class="mx-auto max-w-[1400px] px-4 py-5 mb-10">

  <!-- Problem tabs -->
  <div class="flex gap-2 mb-4 flex-wrap items-center">
    <span class="text-xs font-semibold text-slate-400 mr-1">PROBLEMS:</span>
    <div id="problemTabs" class="flex gap-2"></div>
  </div>

  <div class="grid lg:grid-cols-5 gap-5">

    <!-- LEFT: Problem description + test cases -->
    <div class="lg:col-span-2 space-y-4">
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
        <div class="flex items-start justify-between gap-2 mb-3">
          <div>
            <p id="probNum" class="text-xs font-semibold text-blue-600 uppercase tracking-wide"></p>
            <h2 id="probTitle" class="text-lg font-bold text-[#1a3a6b]"></h2>
          </div>
          <span id="probDiff" class="diff-badge shrink-0 mt-1"></span>
        </div>
        <div id="probDesc" class="text-sm text-slate-700 leading-relaxed"></div>
        <div class="mt-4">
          <button onclick="toggleHints()" class="flex items-center gap-1 text-xs font-semibold text-blue-600 hover:text-blue-800">
            <span id="hintArrow">▶</span>&nbsp;Show hints
          </button>
          <ul id="hintsList" class="hidden mt-2 space-y-1.5 pl-4 list-none"></ul>
        </div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
        <h3 class="text-sm font-bold text-slate-700 mb-3">Test Cases</h3>
        <div id="testCases" class="space-y-2"></div>
        <div id="tcSummary" class="hidden mt-3 pt-3 border-t border-slate-100 text-sm font-semibold text-center"></div>
      </div>
    </div>

    <!-- RIGHT: Editor + output -->
    <div class="lg:col-span-3 space-y-4">
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-slate-100 bg-slate-50">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-red-400"></span>
            <span class="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span class="w-3 h-3 rounded-full bg-green-400"></span>
            <span class="ml-2 text-xs text-slate-400 font-mono">solution.py</span>
          </div>
          <div class="flex gap-2">
            <button onclick="resetCode()" class="text-xs px-3 py-1 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-100">Reset</button>
            <button id="runBtn" onclick="runCode()"
              class="text-xs px-4 py-1.5 rounded-lg bg-blue-700 text-white font-semibold hover:bg-blue-800">
              ▶ Run &amp; Test
            </button>
          </div>
        </div>
        <div id="editor-container"></div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-slate-100 bg-slate-900">
          <span class="text-xs text-slate-400 font-mono">Output &amp; Results</span>
          <button onclick="clearOutput()" class="text-xs text-slate-500 hover:text-slate-300">Clear</button>
        </div>
        <div id="output-panel" class="bg-slate-900 text-green-400 text-xs p-4 min-h-[110px] max-h-[200px] overflow-y-auto">
          <span class="text-slate-500"># Your output will appear here…</span>
        </div>
      </div>

      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="flex gap-2">
          <button id="prevProbBtn" onclick="navigate(-1)"
            class="px-5 py-2 rounded-full border border-slate-300 text-slate-600 text-sm font-semibold hover:bg-slate-50 disabled:opacity-40">
            ← Previous
          </button>
          <button id="nextProbBtn" onclick="navigate(1)"
            class="px-5 py-2 rounded-full bg-slate-700 text-white text-sm font-semibold hover:bg-slate-800">
            Next Problem →
          </button>
        </div>
        <button id="submitBtn" onclick="submitLab()"
          class="hidden px-7 py-2 rounded-full bg-orange-400 text-white font-bold text-sm hover:bg-orange-500 disabled:opacity-40">
          Submit Lab
        </button>
      </div>
    </div>
  </div>

  <div id="resultOverlay" class="hidden mt-6 bg-white rounded-2xl border border-slate-100 shadow-xl p-8 text-center max-w-lg mx-auto">
    <p id="resultEmoji" class="text-5xl"></p>
    <h2 id="resultTitle" class="mt-3 text-2xl font-extrabold text-[#1a3a6b]"></h2>
    <p id="resultMsg" class="mt-2 text-sm text-slate-500 whitespace-pre-line"></p>
    <div id="resultActions" class="mt-5 flex justify-center gap-3 flex-wrap"></div>
  </div>

</main>

<script>var require = { paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } };</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.nls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.js"></script>

<script>
if (requireAuth() && !redirectIfAdmin()) {
  document.getElementById("header").innerHTML = renderHeader("dashboard.html");

  const params = new URLSearchParams(location.search);
  const courseKey = params.get("course");
  const labNo = parseInt(params.get("lab") || "1");
  if (!courseKey) { location.href = "dashboard.html"; }
  document.getElementById("backBtn").href = "course_player.html?course=" + courseKey;

  let labData = null, problems = [], currentIdx = 0;
  let codeByProblem = {}, testResultsByProblem = {};
  let editor = null, pyodide = null, pyodideReady = false;

  // Monaco init
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor-container'), {
      language: 'python', theme: 'vs', fontSize: 13,
      fontFamily: "'Cascadia Code','Fira Code','Courier New',monospace",
      minimap: { enabled: false }, scrollBeyondLastLine: false,
      automaticLayout: true, lineNumbers: 'on', tabSize: 4,
      insertSpaces: true, wordWrap: 'on',
    });
    editor.onDidChangeModelContent(function() {
      if (problems[currentIdx]) codeByProblem[problems[currentIdx].id] = editor.getValue();
    });
    loadLab();
  });

  // Pyodide init
  async function initPyodide() {
    try {
      await new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js';
        s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
      pyodide = await window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/' });
      pyodideReady = true;
      var el = document.getElementById('pyodide-status');
      el.innerHTML = '&#x2705; Python ready';
      el.className = 'flex items-center gap-1 text-xs font-medium px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-700';
    } catch(e) {
      var el = document.getElementById('pyodide-status');
      el.textContent = 'Python failed to load';
      el.className = 'flex items-center gap-1 text-xs font-medium px-3 py-1.5 rounded-full bg-red-100 text-red-700';
    }
  }
  initPyodide();

  async function loadLab() {
    try {
      labData = await api('/api/roadmap/' + courseKey + '/lab/' + labNo);
    } catch(e) {
      showPageError(e.message || "Could not load lab. Complete and pass Modules 1 & 2 first.");
      return;
    }
    problems = labData.problems;
    document.getElementById('labTitle').textContent = labData.title;
    document.getElementById('labSubtitle').textContent = labData.subtitle;
    document.title = labData.title + ' — iGOT Karmayogi';
    problems.forEach(function(p) { codeByProblem[p.id] = p.starter_code; });
    buildTabs();
    showProblem(0);
    if (labData.already_passed) {
      var b = document.getElementById('scoreBadge');
      b.textContent = 'Previously passed — ' + (labData.previous_score||0).toFixed(0) + '%';
      b.className = 'text-sm font-bold px-4 py-1.5 rounded-full bg-emerald-100 text-emerald-700';
      b.classList.remove('hidden');
    }
  }

  function buildTabs() {
    var c = document.getElementById('problemTabs');
    c.innerHTML = problems.map(function(p, i) {
      return '<button onclick="showProblem(' + i + ')" id="tab_' + i + '" class="problem-tab px-4 py-1.5 rounded-full text-sm font-semibold border border-slate-200 text-slate-600 hover:bg-blue-50">' + (i+1) + '. ' + esc(p.title) + '</button>';
    }).join('');
  }

  function showProblem(idx) {
    currentIdx = idx;
    var p = problems[idx];
    document.querySelectorAll('.problem-tab').forEach(function(t, i) { t.classList.toggle('active', i === idx); });
    document.getElementById('probNum').textContent = 'Problem ' + (idx+1) + ' of ' + problems.length;
    document.getElementById('probTitle').textContent = p.title;
    var diff = document.getElementById('probDiff');
    diff.textContent = p.difficulty;
    diff.className = 'diff-badge diff-' + p.difficulty;
    document.getElementById('probDesc').innerHTML = fmtDesc(p.description);
    var list = document.getElementById('hintsList');
    list.innerHTML = (p.hints||[]).map(function(h) { return '<li class="text-xs text-slate-600">&#128161; ' + esc(h) + '</li>'; }).join('');
    list.classList.add('hidden');
    document.getElementById('hintArrow').textContent = '▶';
    renderTestCases(p, testResultsByProblem[p.id] || null);
    editor.setValue(codeByProblem[p.id] || p.starter_code);
    editor.setScrollPosition({ scrollTop: 0 });
    document.getElementById('prevProbBtn').disabled = idx === 0;
    var nb = document.getElementById('nextProbBtn');
    nb.disabled = idx === problems.length - 1;
    nb.textContent = idx === problems.length - 1 ? 'Last Problem' : 'Next Problem →';
    updateSubmitButton();
    if (typeof translateDynamicElement === "function") {
      translateDynamicElement(document.querySelector('.problem-card'), getCurrentLanguage());
    }
  }
  window.showProblem = showProblem;

  function navigate(dir) { showProblem(Math.max(0, Math.min(problems.length-1, currentIdx+dir))); }
  window.navigate = navigate;

  function renderTestCases(prob, results) {
    document.getElementById('testCases').innerHTML = prob.test_cases.map(function(c, i) {
      var r = results ? results[i] : null;
      var cls = !r ? 'pending' : (r.passed ? 'pass' : 'fail');
      var icon = !r ? '⬜' : (r.passed ? '✅' : '❌');
      var extra = '';
      if (r && !r.passed) {
        extra = '<div class="mt-1 text-[10px] font-mono text-red-600">Got: ' + esc(JSON.stringify(r.got)) + '</div>' +
                '<div class="text-[10px] font-mono text-emerald-700">Expected: ' + esc(JSON.stringify(r.expected !== undefined ? r.expected : (c.expected || c.expected_statuses || c.expected_suspicious || c.expected_length))) + '</div>';
      }
      return '<div class="tc-row ' + cls + ' border rounded-lg px-3 py-2"><div class="flex items-start gap-2 text-xs"><span class="shrink-0">' + icon + '</span><span class="text-slate-600">' + esc(c.label) + '</span></div>' + extra + '</div>';
    }).join('');
    var summary = document.getElementById('tcSummary');
    if (results) {
      var passed = results.filter(function(r){ return r.passed; }).length;
      summary.textContent = passed + ' / ' + results.length + ' test cases passed';
      summary.className = 'mt-3 pt-3 border-t border-slate-100 text-sm font-semibold text-center ' + (passed === results.length ? 'text-emerald-600' : 'text-red-500');
      summary.classList.remove('hidden');
    } else {
      summary.classList.add('hidden');
    }
  }

  async function runCode() {
    if (!pyodideReady) { appendOutput('⚠ Python runtime still loading — please wait…', 'warn'); return; }
    var prob = problems[currentIdx];
    var code = editor.getValue();
    codeByProblem[prob.id] = code;
    var runBtn = document.getElementById('runBtn');
    runBtn.disabled = true; runBtn.textContent = '⏳ Running…';
    appendOutput('\n▶ Running Problem ' + (currentIdx+1) + ': ' + prob.title + '…\n', 'info');
    try {
      pyodide.runPython('import sys, io\n_ob = io.StringIO()\n_eb = io.StringIO()\nsys.stdout = _ob\nsys.stderr = _eb');
      var runError = null;
      try { pyodide.runPython(code); } catch(e) { runError = e.message || String(e); }
      var stdout = pyodide.runPython('_ob.getvalue()');
      var stderr = pyodide.runPython('_eb.getvalue()');
      pyodide.runPython('sys.stdout = sys.__stdout__; sys.stderr = sys.__stderr__');
      if (stdout) appendOutput(stdout, 'out');
      if (stderr) appendOutput(stderr, 'err');
      if (runError) appendOutput('❌ ' + runError, 'err');
      if (!runError) {
        var results = await runTestCases(prob, code);
        testResultsByProblem[prob.id] = results;
        renderTestCases(prob, results);
        var p = results.filter(function(r){ return r.passed; }).length;
        appendOutput('\n' + p + '/' + results.length + ' test cases passed.\n', p === results.length ? 'ok' : 'warn');
        updateScoreBadge(); updateSubmitButton();
        updateTabIndicator(currentIdx, p, results.length);
      }
    } catch(e) { appendOutput('Runtime error: ' + String(e), 'err'); }
    runBtn.disabled = false; runBtn.textContent = '▶ Run & Test';
  }
  window.runCode = runCode;

  async function runTestCases(prob, userCode) {
    var results = [];
    for (var i = 0; i < prob.test_cases.length; i++) {
      var tc = prob.test_cases[i];
      try {
        var testCode = buildCall(prob.id, tc, userCode);
        pyodide.runPython('import sys, io\n_ob2=io.StringIO()\nsys.stdout=_ob2');
        var got = null; var errMsg = null;
        try { got = pyodide.runPython(testCode); } catch(e) { errMsg = e.message || String(e); }
        pyodide.runPython('sys.stdout=sys.__stdout__');
        if (errMsg) { results.push({ passed: false, got: errMsg, expected: tc.expected }); continue; }
        var gotJs = got && got.toJs ? got.toJs() : got;
        var passed = checkPass(gotJs, tc);
        results.push({ passed: passed, got: gotJs, expected: tc.expected });
      } catch(e) { results.push({ passed: false, got: String(e), expected: tc.expected }); }
    }
    return results;
  }

  function buildCall(pid, tc, code) {
    var inp = tc.input;
    var call = '';
    if (pid==='pg_p1')  call = 'result=ndvi('+inp.red+','+inp.nir+')\nresult';
    else if (pid==='pg_p2')  call = 'result=filter_vegetation('+JSON.stringify(inp.pixel_list)+','+inp.threshold+')\nresult';
    else if (pid==='pg_p3')  call = 'result=classify_image('+JSON.stringify(inp.pixels)+')\nresult';
    else if (pid==='dto_p1') call = 'result=summary_stats('+JSON.stringify(inp.data)+')\nresult';
    else if (pid==='dto_p2') call = 'result=remove_outliers('+JSON.stringify(inp.data)+')\nresult';
    else if (pid==='dto_p3') call = 'result=group_average('+JSON.stringify(inp.records)+',"'+inp.group_key+'","'+inp.value_key+'")\nresult';
    else if (pid==='dab_p1') call = 'result=classify_npa('+JSON.stringify(inp.loans)+')\nresult';
    else if (pid==='dab_p2') call = 'result=npa_ratio_by_branch('+JSON.stringify(inp.loans)+')\nresult';
    else if (pid==='dab_p3') call = 'result=flag_suspicious('+JSON.stringify(inp.transactions)+','+(inp.threshold||50000)+')\nresult';
    else if (pid==='upi_p1') call = 'result=validate_upi_id('+JSON.stringify(inp.upi_id)+')\nresult';
    else if (pid==='upi_p2') call = 'result=success_rate_by_bank('+JSON.stringify(inp.transactions)+')\nresult';
    else if (pid==='upi_p3') call = 'result=find_duplicates('+JSON.stringify(inp.payments)+')\nresult';
    else call = 'None';
    return code + '\n' + call;
  }

  function checkPass(got, tc) {
    if (tc.expected !== undefined) {
      if (typeof tc.expected === 'number') return typeof got === 'number' && Math.abs(got - tc.expected) < 0.001;
      if (typeof tc.expected === 'boolean') return got === tc.expected;
      if (Array.isArray(tc.expected)) {
        var arr = Array.isArray(got) ? got : (got && got.length !== undefined ? Array.from(got) : null);
        if (!arr || arr.length !== tc.expected.length) return false;
        return tc.expected.every(function(e,i) {
          if (typeof e === 'number') return Math.abs((typeof arr[i]==='number'?arr[i]:parseFloat(arr[i])) - e) < 0.001;
          if (Array.isArray(e)) return JSON.stringify(arr[i]) === JSON.stringify(e);
          return String(arr[i]) === String(e);
        });
      }
      if (typeof tc.expected === 'object') {
        if (!got) return false;
        return Object.keys(tc.expected).every(function(k) {
          var gv = got[k] !== undefined ? got[k] : (got.get ? got.get(k) : undefined);
          return typeof tc.expected[k]==='number' ? Math.abs(gv - tc.expected[k]) < 0.001 : gv === tc.expected[k];
        });
      }
    }
    if (tc.expected_length !== undefined) {
      var len = Array.isArray(got) ? got.length : (got && got.length !== undefined ? got.length : -1);
      if (len !== tc.expected_length) return false;
      if (tc.expected_no_value !== undefined) {
        var arr2 = Array.isArray(got) ? got : Array.from(got);
        return !arr2.includes(tc.expected_no_value);
      }
      return true;
    }
    if (tc.expected_statuses !== undefined) {
      var arr3 = Array.isArray(got) ? got : Array.from(got||[]);
      var statuses = arr3.map(function(item) { return item.status !== undefined ? item.status : (item.get ? item.get('status') : undefined); });
      return statuses.join(',') === tc.expected_statuses.join(',');
    }
    if (tc.expected_suspicious !== undefined) {
      var arr4 = Array.isArray(got) ? got : Array.from(got||[]);
      var flags = arr4.map(function(item) {
        var v = item.suspicious !== undefined ? item.suspicious : (item.get ? item.get('suspicious') : undefined);
        return v === true || v === 1;
      });
      return flags.join(',') === tc.expected_suspicious.join(',');
    }
    return false;
  }

  function totalPassed() {
    return problems.reduce(function(acc, p) {
      var r = testResultsByProblem[p.id];
      return acc + (r && r.every(function(t){return t.passed;}) ? 1 : 0);
    }, 0);
  }
  function overallScore() { return Math.round(100 * totalPassed() / problems.length); }

  function updateScoreBadge() {
    if (!Object.keys(testResultsByProblem).length) return;
    var pct = overallScore();
    var b = document.getElementById('scoreBadge');
    b.textContent = 'Score: ' + pct + '%';
    b.className = 'text-sm font-bold px-4 py-1.5 rounded-full ' + (pct >= 60 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-600');
    b.classList.remove('hidden');
  }

  function updateTabIndicator(idx, passed, total) {
    var tab = document.getElementById('tab_' + idx);
    if (!tab) return;
    var p = problems[idx];
    tab.textContent = (idx+1) + '. ' + p.title + (passed === total ? ' ✅' : ' (' + passed + '/' + total + ')');
  }

  function updateSubmitButton() {
    if (Object.keys(testResultsByProblem).length < problems.length) return;
    var btn = document.getElementById('submitBtn');
    var pct = overallScore();
    btn.classList.remove('hidden');
    btn.textContent = pct >= 60 ? '🚀 Submit Lab (' + pct + '% — Passing!)' : '🚀 Submit Lab (' + pct + '% — Needs 60%)';
    btn.disabled = false;
  }

  async function submitLab() {
    var score = overallScore(), passed = totalPassed();
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Submitting…';
    var lastCode = Object.values(codeByProblem).join('\n\n# --- next problem ---\n\n');
    try {
      var r = await api('/api/roadmap/' + courseKey + '/lab/' + labNo + '/complete', {
        method: 'POST',
        body: { score: score, problems_passed: passed, problems_total: problems.length, code_submitted: lastCode.substring(0, 8000) }
      });
      showResult(r);
    } catch(e) { btn.disabled = false; btn.textContent = '🚀 Submit Lab'; appendOutput('Submit failed: ' + e.message, 'err'); }
  }
  window.submitLab = submitLab;

  function showResult(r) {
    document.getElementById('resultOverlay').classList.remove('hidden');
    document.getElementById('resultEmoji').textContent = r.passed ? '🎉' : '😅';
    document.getElementById('resultTitle').textContent = r.passed ? 'Lab Passed — ' + r.score.toFixed(0) + '%!' : 'Lab Score: ' + r.score.toFixed(0) + '%';
    var msg = r.message || '';
    if (r.readiness_pct) msg += '\n\nYour role readiness is now ' + r.readiness_pct + '%.';
    document.getElementById('resultMsg').textContent = msg;
    document.getElementById('resultActions').innerHTML = r.passed
      ? '<a href="course_player.html?course=' + courseKey + '" class="px-6 py-2 rounded-full bg-blue-700 text-white font-semibold text-sm">Continue Learning →</a><a href="dashboard.html" class="px-6 py-2 rounded-full border border-slate-300 text-slate-600 text-sm">Back to Dashboard</a>'
      : '<button onclick="document.getElementById(\'resultOverlay\').classList.add(\'hidden\')" class="px-6 py-2 rounded-full border border-slate-300 text-slate-600 text-sm">Keep Trying</button>';
  }

  function appendOutput(text, type) {
    var el = document.getElementById('output-panel');
    var colors = { out:'text-green-400', err:'text-red-400', info:'text-blue-400', warn:'text-yellow-400', ok:'text-emerald-400' };
    el.innerHTML += '<span class="' + (colors[type]||'text-slate-400') + '">' + esc(String(text)) + '</span>';
    el.scrollTop = el.scrollHeight;
  }
  function clearOutput() { document.getElementById('output-panel').innerHTML = ''; }
  window.clearOutput = clearOutput;
  function resetCode() { var p = problems[currentIdx]; if (p) { codeByProblem[p.id] = p.starter_code; editor.setValue(p.starter_code); } }
  window.resetCode = resetCode;
  function toggleHints() {
    var list = document.getElementById('hintsList'), arrow = document.getElementById('hintArrow');
    list.classList.toggle('hidden');
    arrow.textContent = list.classList.contains('hidden') ? '▶' : '▼';
  }
  window.toggleHints = toggleHints;

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtDesc(text) {
    return text.split('\n').map(function(line) {
      return line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code class="bg-slate-100 px-1 rounded text-[11px] font-mono">$1</code>').replace(/^- (.+)/,'&bull; $1');
    }).join('<br>');
  }
}
</script>
</body>
</html>
