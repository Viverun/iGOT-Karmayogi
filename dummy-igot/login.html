<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — iGOT Karmayogi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#FCE8D5] min-h-screen text-slate-800">

<header class="pt-4 px-4">
  <nav class="mx-auto max-w-5xl bg-white rounded-full shadow-lg border border-slate-100 px-6 py-2.5 flex items-center gap-4">
    <a href="index.html" class="flex items-center gap-2">
      <span class="text-3xl">🪷</span>
      <span class="leading-tight">
        <span class="block font-bold text-xl text-blue-800">कर्मण्योगी भारत</span>
        <span class="block text-[10px] text-slate-500 border-t border-slate-300 mt-0.5">लोकलहित में कार्यतात्</span>
      </span>
    </a>
    <a href="index.html" class="ml-auto text-sm text-slate-500 hover:text-blue-700">← Back to home</a>
  </nav>
</header>

<main class="mx-auto max-w-md mt-12 mb-16">
  <div class="bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-2xl font-bold text-[#1a3a6b]">Log in to iGOT Karmayogi</h1>
    <p class="text-sm text-slate-500 mt-1">Government officials' capacity building platform.</p>

    <form id="loginForm" class="mt-6 space-y-4">
      <div>
        <label class="text-sm font-medium">Email</label>
        <input id="email" type="email" required placeholder="demo@gov.in"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>
      <div>
        <label class="text-sm font-medium">Password</label>
        <input id="password" type="password" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>
      <p id="error" class="hidden text-sm text-red-600"></p>
      <button type="submit" id="submitBtn"
              class="w-full py-2.5 rounded-full bg-orange-400 text-white font-semibold hover:bg-orange-500 disabled:opacity-50">
        Log in
      </button>
    </form>

    <div class="mt-5 bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm">
      <p class="font-semibold text-amber-800">Demo credentials (prototype — no real authentication)</p>
      <p class="text-amber-700 mt-1">Email: <code class="font-mono">demo@gov.in</code> · Password: <code class="font-mono">demo123</code></p>
    </div>

    <p class="mt-6 text-sm text-slate-600">
      New to iGOT? <a href="register.html" class="text-blue-700 font-semibold">Register here</a>
    </p>
  </div>
</main>

<script>
const API = window.IGOT_API_BASE || (["localhost", "127.0.0.1"].includes(location.hostname) ? "http://localhost:8001" : "https://igot-karmayogi-api.onrender.com");
if (localStorage.getItem("igot_token")) location.href = "index.html";

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("error");
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; errEl.classList.add("hidden");
  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Login failed");
    localStorage.setItem("igot_token", data.access_token);
    localStorage.setItem("igot_user", JSON.stringify(data.user));
    location.href = "index.html";
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
    btn.disabled = false;
  }
});
</script>
</body>
</html>
