<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<title>Org Analytics — iGOT Karmayogi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="common.js"></script>
<style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
<div id="header"></div>

<main class="mx-auto max-w-7xl px-6 py-8 mb-16">
  <h1 class="text-2xl font-bold text-[#1a3a6b]">📊 Organization Analytics</h1>
  <p class="text-sm text-slate-500 mt-1">Workforce competency distribution, training effectiveness and course completions across the organization.</p>

  <div id="statCards" class="mt-6 grid md:grid-cols-4 gap-4"></div>

  <div class="mt-6 grid lg:grid-cols-2 gap-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="font-semibold text-slate-800">Competency distribution (avg score by area)</h2>
      <div class="h-80 mt-3"><canvas id="areaChart"></canvas></div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="font-semibold text-slate-800">Course completions</h2>
      <div class="h-80 mt-3"><canvas id="completionChart"></canvas></div>
    </div>
  </div>

  <div class="mt-6 bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
    <h2 class="font-semibold text-slate-800">Predictive capacity-building needs</h2>
    <div id="needsTable" class="mt-3 text-sm"></div>
  </div>
</main>

<script>
if (requireAuth()) {
  document.getElementById("header").innerHTML = renderHeader("admin.html");

  async function load() {
    const a = await api("/api/admin/analytics");
    document.getElementById("statCards").innerHTML = `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5"><p class="text-3xl font-extrabold text-blue-800">${a.total_users}</p><p class="text-xs text-slate-400 mt-1">registered karmayogis</p></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5"><p class="text-3xl font-extrabold text-blue-800">${a.competency_distribution.length}</p><p class="text-xs text-slate-400 mt-1">competencies tracked</p></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5"><p class="text-3xl font-extrabold text-blue-800">${a.course_completions.reduce((s, c) => s + c.completions, 0)}</p><p class="text-xs text-slate-400 mt-1">total completions</p></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5"><p class="text-3xl font-extrabold ${a.competency_distribution[0] && a.competency_distribution[0].avg_score < 40 ? 'text-red-600' : 'text-blue-800'}">${a.competency_distribution[0] ? a.competency_distribution[0].area : '—'}</p><p class="text-xs text-slate-400 mt-1">weakest org-wide area</p></div>`;

    const dist = [...a.competency_distribution].reverse();  // weakest last for horizontal bars
    new Chart(document.getElementById("areaChart"), {
      type: "bar",
      data: {
        labels: dist.map(d => d.area),
        datasets: [{ label: "avg score", data: dist.map(d => d.avg_score),
                     backgroundColor: dist.map(d => d.avg_score >= 70 ? "#10b981" : d.avg_score >= 40 ? "#f59e0b" : "#ef4444") }]
      },
      options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false } },
                 scales: { x: { suggestedMax: 100 } } }
    });

    new Chart(document.getElementById("completionChart"), {
      type: "bar",
      data: {
        labels: a.course_completions.map(c => c.course),
        datasets: [{ label: "completions", data: a.course_completions.map(c => c.completions), backgroundColor: "#1a6fd4" }]
      },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    const weakest = a.competency_distribution.slice(0, 5);
    document.getElementById("needsTable").innerHTML = `
      <table class="w-full">
        <thead><tr class="text-left text-xs text-slate-400 border-b border-slate-100">
          <th class="py-2">Emerging skill need</th><th>Org avg score</th><th>Officers measured</th><th>Recommended action</th></tr></thead>
        <tbody>
          ${weakest.map(w => `
            <tr class="border-b border-slate-50">
              <td class="py-2 font-medium">${w.area}</td>
              <td>${w.avg_score}</td>
              <td>${w.n}</td>
              <td class="text-slate-500">Schedule targeted ${w.area} training wave via iGOT catalogue</td>
            </tr>`).join("")}
        </tbody>
      </table>`;
  }

  load().catch(e => document.body.insertAdjacentHTML("beforeend", `<p class="text-red-600 p-6">${e.message}</p>`));
}
</script>
</body>
</html>
